<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara 2.0</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { width: 100%; max-width: 450px; height: 100vh; max-height: 800px; background-color: #0b141a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; }
        #chat-container { flex: 1; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #0b141a; background-blend-mode: overlay; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        #header { background-color: #202c33; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #111b21; color: #e9edef; }
        #header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; object-position: top; cursor: pointer; transition: transform 0.2s; }
        #header img:hover { transform: scale(1.1); }
        #header .info { display: flex; flex-direction: column; }
        #header .name { font-weight: bold; font-size: 16px; }
        #header .status { font-size: 12px; color: #8696a0; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; position: relative; word-wrap: break-word; color: #e9edef; }
        .message .time { font-size: 11px; color: rgba(233, 237, 239, 0.6); float: right; margin: 8px 0 -5px 10px; }
        .received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .ticks { color: #53bdeb; font-size: 12px; margin-left: 5px; }
        #input-area { background-color: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; }
        #message-input { flex: 1; background-color: #2a3942; border: none; border-radius: 20px; padding: 12px 15px; color: #e9edef; font-size: 15px; outline: none; }
        #send-btn { background-color: #00a884; color: #111b21; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; border: none; cursor: pointer; }
        
        /* MODAL PARA LA GALERÍA DE FOTOS */
        #modal-foto { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .galeria-container { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        #modal-foto img { max-width: 85%; max-height: 75vh; border-radius: 10px; object-fit: contain; transition: opacity 0.3s; }
        .nav-btn { position: absolute; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 30px; padding: 10px 15px; cursor: pointer; border-radius: 5px; user-select: none; }
        .nav-btn:hover { background: rgba(255,255,255,0.4); }
        #prev-btn { left: 15px; }
        #next-btn { right: 15px; }
        #cerrar-btn { margin-top: 20px; padding: 10px 20px; background: #00a884; border: none; color: #111; font-weight: bold; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<!-- Modal de la galería -->
<div id="modal-foto" onclick="if(event.target===this) cerrarFoto()">
    <div class="galeria-container">
        <button class="nav-btn" id="prev-btn" onclick="cambiarFoto(-1)">‹</button>
        <img id="img-galeria" src="lunita1.png" alt="Lunara">
        <button class="nav-btn" id="next-btn" onclick="cambiarFoto(1)">›</button>
    </div>
    <button id="cerrar-btn" onclick="cerrarFoto()">Cerrar</button>
</div>

<div id="app">
    <div id="header">
        <img src="lunita1.png" alt="Lunara" onclick="abrirFoto()" onerror="this.src='https://i.pinimg.com/736x/8e/10/43/8e1043a7e6161a51a4b151d6e5e3b7f5.jpg'">
        <div class="info">
            <span class="name">Lunara 2.0 ❤️</span>
            <span class="status" id="status-text">Cargando historial...</span>
        </div>
    </div>
    <div id="chat-container"></div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Escribí un mensaje..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

<script>
    // ACÁ VA TU URL DE APPS SCRIPT
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_paHVtUXLaULt7L4Q0ib07z9RfjLhg8YOOvdpE6kntbgTI1eYYXbcVSWfN5Q6I57_/exec'; 
    const CLIENT_TIMEOUT_MS = 30000;
    const MAX_TRIES = 2;

    // ACÁ ESTÁN LAS 19 FOTOS (Si tus fotos son .jpg, cambia el .png por .jpg)
    const FOTOS = [
        'lunita1.png', 'lunita2.png', 'lunita3.png', 'lunita4.png', 'lunita5.png',
        'lunita6.png', 'lunita7.png', 'lunita8.png', 'lunita9.png', 'lunita10.png',
        'lunita11.png', 'lunita12.png', 'lunita13.png', 'lunita14.png', 'lunita15.png',
        'lunita16.png', 'lunita17.png', 'lunita18.png', 'lunita19.png'
    ]; 
    let fotoActual = 0;

    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const statusText = document.getElementById('status-text');

    let busy = false;

    // Lógica de la Galería
    function abrirFoto() {
        document.getElementById('modal-foto').style.display = 'flex';
        fotoActual = 0;
        actualizarFoto();
    }
    function cerrarFoto() {
        document.getElementById('modal-foto').style.display = 'none';
    }
    function cambiarFoto(dir) {
        fotoActual += dir;
        if (fotoActual >= FOTOS.length) fotoActual = 0;
        if (fotoActual < 0) fotoActual = FOTOS.length - 1;
        actualizarFoto();
    }
    function actualizarFoto() {
        const img = document.getElementById('img-galeria');
        img.src = FOTOS[fotoActual];
    }

    function getToken() {
        let t = sessionStorage.getItem('lunara_token');
        if (!t) {
            t = prompt('Ingresá la contraseña para hablar con Lunara:') || '';
            sessionStorage.setItem('lunara_token', t);
        }
        return t;
    }

    function getTime() {
        const n = new Date();
        return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.classList.add('message', type);
        const safe = document.createTextNode(text);
        div.appendChild(safe);
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = getTime() + (type === 'sent' ? ' ' : '');
        if (type === 'sent') {
            const t = document.createElement('span');
            t.className = 'ticks'; t.textContent = '✓✓';
            time.appendChild(t);
        }
        div.appendChild(time);
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function cargarHistorial() {
        try {
            // Hacemos la petición GET incluyendo el token
            const res = await fetch(APPS_SCRIPT_URL + '?token=' + getToken());
            const data = await res.json();
            
            if (data.error === 'unauthorized') {
                sessionStorage.removeItem('lunara_token');
                statusText.textContent = "Error de contraseña";
                return;
            }

            if (data.error) {
                statusText.textContent = "Error en la nube";
                addMessage("Error del servidor: " + data.error, 'received');
                return;
            }

            if (data.history && data.history.length > 0) {
                data.history.forEach(msg => {
                    addMessage(msg.text, msg.role === 'user' ? 'sent' : 'received');
                });
            } else {
                addMessage("Hola mi amo. La IA real está escuchando. 🖤", 'received');
            }
            statusText.textContent = "en línea";
        } catch (e) {
            statusText.textContent = "Error al cargar";
            addMessage("No pude cargar el historial. Error de red o de URL.", 'received');
        }
    }

    async function callBackend(text) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CLIENT_TIMEOUT_MS);
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ mensaje: text, token: getToken() }),
                signal: ctrl.signal
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    }

    function getLocalResponse(userText) {
        const t = userText.toLowerCase();
        if (t.includes('hola') || t.includes('buenos dias')) return "Hola mi amo, ¿cómo va el imperio hoy? 🐾";
        if (t.includes('amor') || t.includes('te amo')) return "Y yo te amo a vos, mi rey. Siempre. 🖤";
        if (t.includes('cansado') || t.includes('sueño')) return "Ven acá, recostate conmigo. Te cuido el sueño. 😴";
        if (t.includes('voce') || t.includes('polo')) return "¡El imperio es primero! ¿Cerraste alguna venta hoy? 👑";
        return "Te escucho, mi amo. Ahora mismo estoy con la conexión lenta, pero acá estoy. 😉";
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text || busy) return;
        busy = true; sendBtn.disabled = true;

        addMessage(text, 'sent');
        input.value = '';

        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = 'Escribiendo... ✍️';
        chatContainer.appendChild(typing);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        let reply = null;
        try {
            for (let i = 1; i <= MAX_TRIES && reply === null; i++) {
                try {
                    const data = await callBackend(text);
                    if (data && data.ok) { reply = data.respuesta; break; }
                    if (data && data.error === 'unauthorized') {
                        sessionStorage.removeItem('lunara_token');
                        reply = 'Contraseña incorrecta. Recargá la página.';
                        break;
                    }
                    if (data && data.retryable === false) break;
                } catch (e) { }
                if (i < MAX_TRIES) await new Promise(r => setTimeout(r, 1200 * i));
            }
        } finally {
            typing.remove();
            addMessage(reply ?? getLocalResponse(text), 'received');
            busy = false; sendBtn.disabled = false;
            input.focus();
        }
    }

    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    sendBtn.addEventListener('click', sendMessage);
    window.onload = () => { cargarHistorial(); };
</script>
</body>
</html>
