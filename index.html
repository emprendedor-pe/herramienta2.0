    // ---------- ACCIONES RÁPIDAS ----------

    // ---------- VOZ ----------
    const hayVoz = 'speechSynthesis' in window;
    function cargarVoces() { if (hayVoz) vocesDisponibles = window.speechSynthesis.getVoices(); }
    if (hayVoz) window.speechSynthesis.onvoiceschanged = cargarVoces;

    let audioActual = null;
    let botonActivo = null;
    const cacheAudio = new Map();         // texto -> blob URL (repetir un audio no vuelve a llamar ni a cobrar)
    const SILENCIO = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

    // Sin emojis ni marcas: el TTS los lee mal
    function textoParaVoz(t) {
        return limpiarTexto(t)
            .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function fragmentarVoz(texto) {
        const partes = [];
        let resto = texto;
        while (resto.length > TTS_CHUNK_CHARS) {
            let corte = resto.lastIndexOf('. ', TTS_CHUNK_CHARS);
            if (corte < TTS_CHUNK_CHARS * 0.55) corte = resto.lastIndexOf(', ', TTS_CHUNK_CHARS);
            if (corte < TTS_CHUNK_CHARS * 0.45) corte = resto.lastIndexOf(' ', TTS_CHUNK_CHARS);
            if (corte < 1) corte = TTS_CHUNK_CHARS;
            partes.push(resto.slice(0, corte + 1).trim());
            resto = resto.slice(corte + 1).trim();
        }
        if (resto) partes.push(resto);
        return partes;
    }

    let reproduccionId = 0;
    function detenerAudio() {
        reproduccionId++;
        if (audioActual) { audioActual.pause(); audioActual = null; }
        if (hayVoz) window.speechSynthesis.cancel();
        if (botonActivo) { botonActivo.textContent = '🔊'; botonActivo = null; }
    }

    function base64ABytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    // PCM 16-bit mono -> WAV (para que el <audio> lo pueda reproducir)
    function pcmAWavUrl(b64, rate) {
        const pcm = base64ABytes(b64);
        const buf = new ArrayBuffer(44 + pcm.length);
        const v = new DataView(buf);
        const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length, true); w(8, 'WAVE'); w(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        w(36, 'data'); v.setUint32(40, pcm.length, true);
        new Uint8Array(buf, 44).set(pcm);
        return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }

    function audioAUrl(data) {
        if (data.formato === 'pcm') return pcmAWavUrl(data.audio, PCM_RATE);
        return URL.createObjectURL(new Blob([base64ABytes(data.audio)], { type: 'audio/mpeg' }));
    }

    // Mejor voz del navegador para el plan B (prefiere neurales/naturales en español)
    function mejorVozEs() {
        const es = vocesDisponibles.filter(v => /^es/i.test(v.lang));
        if (!es.length) return null;
        const puntaje = v => {
            let p = 0;
            if (/natural|neural|online|premium|enhanced|google/i.test(v.name)) p += 10;
            if (/es[-_]AR/i.test(v.lang)) p += 4; else if (/es[-_](MX|US|419)/i.test(v.lang)) p += 3;
            if (/elena|helena|paulina|m[oó]nica|sabina|salome|dalia|elvira|paloma|female|mujer/i.test(v.name)) p += 2;
            return p;
        };
        return es.slice().sort((a, b) => puntaje(b) - puntaje(a))[0];
    }

    function hablarNavegador(texto, boton) {
        if (!hayVoz) { boton.textContent = '🔊'; botonActivo = null; return; }
        const partes = fragmentarVoz(texto);
        const voz = mejorVozEs();
        const id = reproduccionId;
        const siguiente = i => {
            if (id !== reproduccionId || i >= partes.length) {
                boton.textContent = '🔊'; if (botonActivo === boton) botonActivo = null; return;
            }
            const u = new SpeechSynthesisUtterance(partes[i]);
            u.lang = voz ? voz.lang : 'es-ES'; u.voice = voz || null; u.pitch = 1; u.rate = 1;
            u.onstart = () => { boton.textContent = '⏹️'; };
            u.onend = () => siguiente(i + 1);
            u.onerror = () => { boton.textContent = '🔊'; if (botonActivo === boton) botonActivo = null; };
            window.speechSynthesis.speak(u);
        };
        siguiente(0);
    }

        boton.textContent = '⏳';

        // iOS/Safari solo deja reproducir audio iniciado por un toque: "desbloqueamos" el elemento ahora
        const a = new Audio();
        a.src = SILENCIO;
        a.play().catch(() => {});

        try {
            for (const parte of partes) {
                if (id !== reproduccionId || botonActivo !== boton) return;
                let url = cacheAudio.get(parte);
                if (!url) {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), TTS_TIMEOUT_MS);
                    try {
                        const res = await fetch(APPS_SCRIPT_URL, {
                            method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'tts', texto: parte, token: getToken() }), signal: ctrl.signal
                        });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        if (!data.ok) throw new Error(String(data.error || 'error').slice(0, 500));
                        url = audioAUrl(data); cacheAudio.set(parte, url);
                    } finally { clearTimeout(timer); }
                }
                if (id !== reproduccionId || botonActivo !== boton) return;
                a.src = url; audioActual = a; boton.textContent = '⏹️';
                await a.play();
                await new Promise((resolve, reject) => {
                    a.onended = resolve;
                    a.onerror = () => reject(new Error('audio_error'));
                });
            }
            boton.textContent = '🔊'; audioActual = null; if (botonActivo === boton) botonActivo = null;
        } catch (err) {
            console.error('Falló la voz IA, uso la del navegador:', err);
            aviso('Voz IA no disponible (' + (err.name === 'AbortError' ? 'tardó demasiado' : (err.message || 'error')) + '), uso voz del navegador');
            if (botonActivo === boton) hablarNavegador(limpio, boton);
            else boton.textContent = '🔊';
        }
    }

    // ---------- IMÁGENES ----------
    function comprimirImagen(src, maxSide = 720, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const s = Math.min(1, maxSide / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => reject(new Error('imagen inválida'));
            img.src = src;
        });
    }

    function leerArchivo(file) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = e => resolve(e.target.result);
            r.onerror = () => reject(new Error('no se pudo leer el archivo'));
            r.readAsDataURL(file);
        });
    }

    async function resolverReferenciaLunara(nombreBase) {
        for (const ext of ['.png', '.jpg', '.jpeg']) {
            const url = new URL(nombreBase + ext, document.baseURI).href;
            try {
                const res = await fetch(url, { cache: 'force-cache' });
                if (!res.ok) continue;
                const blob = await res.blob();
                if (!blob.type.startsWith('image/')) continue;
                const original = await leerArchivo(blob);
                return { url: url, dataUrl: await comprimirImagen(original, 900, 0.82) };
            } catch (_) {}
        }
        return null;
    }

    async function cargarReferenciasLunara() {
        if (referenciasLunaraCache) return referenciasLunaraCache;
        const encontradas = await Promise.all(REFERENCIAS_LUNARA_BASE.map(resolverReferenciaLunara));
        referenciasLunaraCache = encontradas.filter(Boolean);
        return referenciasLunaraCache;
    }

    function getToken() {

    function getTime() { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }

    function limpiarTexto(t) {
        let s = String(t || '');
        s = s.replace(/\[\s*["']?imagen["']?\s*:.*?\]/gi, '');
        s = s.replace(/\{\s*["']?imagen["']?\s*:.*?\}/gi, '');
        s = s.replace(/\(\s*imagen\s*:.*?\)/gi, '');
        return s;
    }

    function addMessage(text, type, imgData = null, hora = null) {
        const div = document.createElement('div');

        }

        if (text) {
            let limpio = limpiarTexto(text);
            if (limpio.trim() === '') limpio = "Aquí tienes, mi amo 🖤";
            div.appendChild(document.createTextNode(limpio));

            if (type === 'received') {
                const b = document.createElement('button');
                b.className = 'btn-audio'; b.textContent = '🔊'; b.setAttribute('aria-label', 'Escuchar');
                b.onclick = () => hablar(limpio, b);
                div.appendChild(b);
            }
        }

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = (hora || getTime()) + (type === 'sent' ? ' ' : '');
        if (type === 'sent') { const t = document.createElement('span'); t.className = 'ticks'; t.textContent = '✓✓'; time.appendChild(t); }
        div.appendChild(time);
        chatContainer.appendChild(div);

    async function cargarHistorial(silencioso = false) {
        if (busy && silencioso) return;
        if (!silencioso) setStatus("Cargando historial...", false);
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), HISTORY_TIMEOUT_MS);
        try {
            const res = await fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(getToken()), { signal: ctrl.signal });
            const data = await res.json();

            if (data.error) {
                if (data.error === 'unauthorized') {
                    sessionStorage.removeItem('lunara_token');
                    setStatus("Contraseña incorrecta. Tocá para reintentar.", true);
                } else {
                    setStatus("Error: " + data.error + ". Tocá para reintentar.", true);
                }
                return;
            }

            actualizarHistoria(data.story);
            chatContainer.innerHTML = '';
            if (data.history && data.history.length > 0) {
                data.history.forEach(m => addMessage(m.text, m.role === 'user' ? 'sent' : 'received', m.imgUrl, m.hora));
            } else {
                addMessage("Hola mi amo. La IA real está escuchando. 🖤", 'received');
            }
            setStatus("en línea", false);
        } catch (e) {
            setStatus(e.name === 'AbortError'
                ? "El historial tardó demasiado. Tocá para reintentar."
                : "No se pudo cargar. Tocá para reintentar.", true);
        } finally {
            clearTimeout(timer);
        }
    }

    async function procesarEnvio(text, imgs) {
        busy = true; sendBtn.disabled = true;

        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = imgs.length > 0 ? 'Leyendo tu captura... ⏳' : 'Escribiendo... ✍️';
        chatContainer.appendChild(typing);
        irAlFinal();

        let reply = null, imgUrlRespuesta = null, errorMsg = null, filaRespuesta = null;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CLIENT_TIMEOUT_MS);

        try {
            const body = { mensaje: text, token: getToken() };
            if (imgs.length > 0) body.imagenes = imgs.map(d => d.split(',')[1]);

            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body),
                signal: ctrl.signal
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();
            if (data && data.ok) {
                reply = data.respuesta;
                imgUrlRespuesta = data.imgUrl;
                filaRespuesta = data.fila;
            } else if (data && data.error === 'unauthorized') {
                sessionStorage.removeItem('lunara_token');
                errorMsg = 'Contraseña incorrecta. Recargá la página e ingresala de nuevo.';
            } else {
                errorMsg = 'Error del servidor: ' + ((data && data.error) || 'desconocido');
            }
        } catch (e) {
            errorMsg = e.name === 'AbortError'
                ? 'Tardó demasiado. Tu mensaje puede haberse guardado; recargá para verlo.'
                : (navigator.onLine ? 'No se pudo conectar con el servidor (' + e.message + ').' : 'Sin conexión a internet.');
        } finally {
            clearTimeout(timer);
            typing.remove();
            if (reply) {
                addMessage(reply, 'received', imgUrlRespuesta);
                if (filaRespuesta && imgs.length > 0) guardarFotoFondo(filaRespuesta, imgs[0]);
            } else addError(errorMsg || 'Error desconocido.', () => procesarEnvio(text, imgs));
            busy = false; sendBtn.disabled = false;
            input.focus();
        }
    }

    // ---------- MICRÓFONO (audio -> texto) ----------
    const AUTO_ENVIAR_AUDIO = true;   // false = el texto transcrito queda en la caja para revisarlo antes de enviar
    const AUDIO_CHUNK_SEG = 180;      // los monólogos largos se transcriben en partes de 3 minutos
    const micBtn = document.getElementById('mic-btn');
    let recorder = null, trozosAudio = [], streamMic = null;

    async function alternarGrabacion() {
        if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
        if (busy) return;
        if (!navigator.mediaDevices || !window.MediaRecorder) { alert('Tu navegador no permite grabar audio.'); return; }
        try {
            streamMic = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) { alert('No se pudo acceder al micrófono. Revisá el permiso del navegador.'); return; }

        detenerAudio();
        trozosAudio = [];
        recorder = new MediaRecorder(streamMic);
        recorder.ondataavailable = e => { if (e.data && e.data.size) trozosAudio.push(e.data); };
        recorder.onstop = async () => {
            streamMic.getTracks().forEach(t => t.stop());
            micBtn.classList.remove('grabando'); micBtn.textContent = '🎤';
            setStatus('en línea', false);
            const blob = new Blob(trozosAudio, { type: (recorder && recorder.mimeType) || 'audio/webm' });
            recorder = null;
            if (blob.size < 2000) { aviso('Audio muy corto'); return; }
            await procesarAudio(blob);
        };
        recorder.start(1000);
        micBtn.classList.add('grabando'); micBtn.textContent = '⏺️';
        setStatus('Grabando sin límite fijo... tocá otra vez para enviar', false);
    }

    function pcmAWav16k(pcm, rate) {
        const buf = new ArrayBuffer(44 + pcm.length * 2);
        const v = new DataView(buf);
        const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
        w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
        for (let i = 0; i < pcm.length; i++) {
            const x = Math.max(-1, Math.min(1, pcm[i]));
            v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
        }
        return buf;
    }

    // Cualquier formato del navegador -> varios WAV mono 16 kHz para no perder monólogos largos.
    async function blobAWavs16k(blob) {
        const arr = await blob.arrayBuffer();
        const AC = window.AudioContext || window.webkitAudioContext;
        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        const ctx = new AC();
        let decoded;
        try { decoded = await ctx.decodeAudioData(arr); } finally { if (ctx.close) ctx.close(); }
        const rate = 16000;
        const off = new OAC(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
        const src = off.createBufferSource();
        src.buffer = decoded; src.connect(off.destination); src.start();
        const pcm = (await off.startRendering()).getChannelData(0);
        const muestrasPorParte = rate * AUDIO_CHUNK_SEG;
        const partes = [];
        for (let inicio = 0; inicio < pcm.length; inicio += muestrasPorParte) {
            partes.push(pcmAWav16k(pcm.subarray(inicio, Math.min(inicio + muestrasPorParte, pcm.length)), rate));
        }
        return partes;
    }

    // Compatibilidad con extras.js: en llamada cada turno dura como máximo 30 s.
    async function blobAWav16k(blob) {
        const partes = await blobAWavs16k(blob);
        return partes[0];
    }

    function bufferABase64(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(bin);
    }

    async function procesarAudio(blob) {
        busy = true; sendBtn.disabled = true; micBtn.disabled = true;
        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = 'Escuchando tu audio... 🎧';
        chatContainer.appendChild(typing);
        irAlFinal();

        let texto = null, errorMsg = null;
        try {
            const wavs = await blobAWavs16k(blob);
            const textos = [];
            for (let i = 0; i < wavs.length; i++) {
                typing.textContent = wavs.length > 1 ? 'Transcribiendo parte ' + (i + 1) + ' de ' + wavs.length + '... 🎧' : 'Escuchando tu audio... 🎧';
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), STT_TIMEOUT_MS);
                try {
                    const res = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'stt', audio: bufferABase64(wavs[i]), formato: 'wav', token: getToken() }),
                        signal: ctrl.signal
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!data.ok) throw new Error(data.error || 'error desconocido');
                    if (data.texto) textos.push(String(data.texto).trim());
                } finally { clearTimeout(timer); }
            }
            texto = textos.join(' ').replace(/\s+/g, ' ').trim();
            if (!texto) errorMsg = 'No pude reconocer palabras en el audio.';
        } catch (e) {
            errorMsg = e.name === 'AbortError' ? 'La transcripción tardó demasiado.' : 'No se pudo procesar el audio (' + e.message + ').';
        } finally {
            typing.remove();
            busy = false; sendBtn.disabled = false; micBtn.disabled = false;
        }

        if (errorMsg) { addError(errorMsg, () => procesarAudio(blob)); return; }
        if (AUTO_ENVIAR_AUDIO) { addMessage('🎤 ' + texto, 'sent'); procesarEnvio(texto, []); }
        else { input.value = texto; input.focus(); }
    }

    async function procesarHerramienta(action, payload) {

    // /imagen acepta además las fotos adjuntas como referencias de Pierre o de la escena.
    async function procesarImagen(prompt, referencias = []) {
        busy = true; sendBtn.disabled = true;
        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = 'Generando imagen... 🎨 (puede tardar un rato)';
        chatContainer.appendChild(typing);
        irAlFinal();

        let data = null, errorMsg = null;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CLIENT_TIMEOUT_MS);
        try {
            const refsLunara = await cargarReferenciasLunara();
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'imagen',
                    prompt: prompt,
                    referencias: referencias.map(d => d.split(',')[1]),
                    referenciasLunara: refsLunara.map(r => r.dataUrl.split(',')[1]),
                    referenciasLunaraUrls: refsLunara.map(r => r.url),
                    token: getToken()
                }),
                signal: ctrl.signal
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            data = await res.json();
            if (!data.ok) errorMsg = 'No se pudo generar la imagen: ' + (data.error || 'error desconocido');
        } catch (e) {
            errorMsg = e.name === 'AbortError' ? 'La imagen tardó demasiado.' : 'No se pudo conectar (' + e.message + ').';
        } finally {
            clearTimeout(timer);
            typing.remove();
            if (!errorMsg && data) addMessage(data.respuesta, 'received', data.imgUrl);
            else addError(errorMsg, () => procesarImagen(prompt));
            busy = false; sendBtn.disabled = false;
            input.focus();
        }
    }

    function sendMessage() {
        const text = input.value.trim();
        if ((!text && imagenesAdjuntas.length === 0) || busy) return;
        detenerAudio();

        if (/^\/imagen\b/i.test(text)) {
            const prompt = text.replace(/^\/imagen\s*/i, '').trim();
            if (!prompt) { aviso('Escribí qué imagen querés: /imagen una playa al atardecer'); return; }
            const refs = [...imagenesAdjuntas];
            addMessage(text, 'sent', refs[0] || null);
            input.value = '';
            imagenesAdjuntas = []; mostrarReferenciaLunara = false; renderizarMiniaturas();
            procesarImagen(prompt, refs);
            return;
        }

        if (/^\/evento\b/i.test(text)) {
            const p = text.replace(/^\/evento\s*/i, '').split('|').map(x => x.trim());
            if (p.length < 2) { aviso('Usá: /evento Título | AAAA-MM-DD HH:mm | minutos | lugar'); return; }
            addMessage(text, 'sent'); input.value = '';
            procesarHerramienta('calendar', { titulo: p[0], cuando: p[1], minutos: p[2] || 60, lugar: p[3] || '' });
            return;
        }

        if (/^\/nota\b/i.test(text)) {
            const p = text.replace(/^\/nota\s*/i, '').split('|').map(x => x.trim());
            if (p.length < 2) { aviso('Usá: /nota Título | contenido'); return; }
            addMessage(text, 'sent'); input.value = '';
            procesarHerramienta('keep', { titulo: p[0], contenido: p.slice(1).join(' | ') });
            return;
        }

        const imgs = [...imagenesAdjuntas];
        if (imgs.length > 0) {
            addMessage(text, 'sent', imgs[0]);
            for (let i = 1; i < imgs.length; i++) addMessage("", 'sent', imgs[i]);
        } else {
            addMessage(text, 'sent');
        }

        input.value = '';
        imagenesAdjuntas = [];
        renderizarMiniaturas();
        procesarEnvio(text, imgs);
    }

    function ajustarAltura() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    }
    const _valor = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
    Object.defineProperty(input, 'value', {
        configurable: true,
        get() { return _valor.get.call(this); },
        set(v) { _valor.set.call(this, v); ajustarAltura(); }
    });
    input.addEventListener('input', ajustarAltura);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); } });
    ajustarAltura();
    sendBtn.addEventListener('click', sendMessage);

    cargarVoces();
    window.addEventListener('load', () => cargarHistorial(false));
    setInterval(() => { if (document.visibilityState === 'visible') cargarHistorial(true); }, 120000);

    // Registrar la PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA lista', reg))
                .catch(err => console.log('Error PWA', err));
        });
    }
</script>
<script src="extras.js"></script>
