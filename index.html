<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara 2.0</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { width: 100%; max-width: 450px; height: 100vh; max-height: 800px; background-color: #0b141a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; transition: max-width 0.3s ease; overflow: hidden; }
        @media (min-width: 768px) { #app { max-width: 800px; height: 90vh; border-radius: 15px; } }

        #chat-container { flex: 1; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #0b141a; background-blend-mode: overlay; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        #header { background-color: #202c33; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #111b21; color: #e9edef; z-index: 10;}
        #header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; object-position: top; cursor: pointer; transition: transform 0.2s; }
        #header img:hover { transform: scale(1.1); }
        #header .info { display: flex; flex-direction: column; }
        #header .name { font-weight: bold; font-size: 16px; }
        #header .status { font-size: 12px; color: #8696a0; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; position: relative; word-wrap: break-word; color: #e9edef; }
        .message .time { font-size: 11px; color: rgba(233, 237, 239, 0.6); float: right; margin: 8px 0 -5px 10px; }
        .received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .ticks { color: #53bdeb; font-size: 12px; margin-left: 5px; }
        
        #preview-area { display: none; background-color: #202c33; padding: 10px; gap: 10px; flex-wrap: wrap; border-top: 1px solid #111b21; }
        .preview-box { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #00a884; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .preview-box .remove-img { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        #input-area { background-color: #202c33; padding: 10px; display: flex; align-items: center; gap: 5px; z-index: 10;}
        #message-input { flex: 1; background-color: #2a3942; border: none; border-radius: 20px; padding: 12px 15px; color: #e9edef; font-size: 15px; outline: none; }
        .btn-icon { background: none; border: none; color: #8696a0; font-size: 22px; cursor: pointer; padding: 5px; }
        .btn-icon:hover { color: #e9edef; }
        #send-btn { background-color: #00a884; color: #111b21; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        
        /* DISEÑO DE LAS FOTOS EN EL CHAT */
        .message img { max-width: 100%; border-radius: 8px; margin-bottom: 5px; display: block; cursor: pointer; transition: filter 0.2s; }
        .message img:hover { filter: brightness(0.8); }

        .btn-audio { background: rgba(255, 255, 255, 0.1); border: none; color: #00a884; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; cursor: pointer; margin-left: 8px; display: inline-flex; justify-content: center; align-items: center; vertical-align: middle; transition: background 0.2s; }
        .btn-audio:hover { background: rgba(255, 255, 255, 0.3); }

        /* MODALES */
        #modal-foto, #modal-camara, #modal-chat-img { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        #modal-camara { background: #000; z-index: 110; }
        #modal-chat-img { z-index: 120; cursor: zoom-out; } /* Z-index más alto para que esté sobre todo */
        
        .galeria-container { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        #modal-foto img { max-width: 85%; max-height: 75vh; border-radius: 10px; object-fit: contain; }
        
        /* FOTO A PANTALLA COMPLETA */
        #img-chat-full { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; cursor: default; box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        .nav-btn { position: absolute; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 30px; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        #prev-btn { left: 15px; } #next-btn { right: 15px; }
        #cerrar-btn { margin-top: 20px; padding: 10px 20px; background: #00a884; border: none; color: #111; font-weight: bold; border-radius: 20px; cursor: pointer; }
        
        #video-camara { width: 80%; max-width: 600px; border-radius: 10px; border: 2px solid #333; }
        .camara-botones { display: flex; gap: 20px; margin-top: 20px; }
        .btn-camara { padding: 12px 20px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; font-size: 16px; }
        #btn-capturar { background: #00a884; color: #111; }
        #btn-cerrar-cam { background: #f44336; color: white; }
    </style>
</head>
<body>

<!-- Modal para ver foto del chat a pantalla completa -->
<div id="modal-chat-img" onclick="if(event.target===this) cerrarChatImg()">
    <img id="img-chat-full" src="" alt="Foto a pantalla completa">
</div>

<!-- Modal Galería (Foto de perfil) -->
<div id="modal-foto" onclick="if(event.target===this) cerrarFoto()">
    <div class="galeria-container">
        <button class="nav-btn" id="prev-btn" onclick="cambiarFoto(-1)">‹</button>
        <img id="img-galeria" src="lunita1.png" alt="Lunara">
        <button class="nav-btn" id="next-btn" onclick="cambiarFoto(1)">›</button>
    </div>
    <button id="cerrar-btn" onclick="cerrarFoto()">Cerrar</button>
</div>

<!-- Modal Cámara Webcam -->
<div id="modal-camara">
    <video id="video-camara" autoplay playsinline></video>
    <div class="camara-botones">
        <button id="btn-capturar" class="btn-camara" onclick="tomarFotoWebcam()">📸 Capturar</button>
        <button id="btn-cerrar-cam" class="btn-camara" onclick="cerrarCamaraWebcam()">Cancelar</button>
    </div>
</div>

<div id="app">
    <div id="header">
        <img src="lunita1.png" alt="Lunara" onclick="abrirFoto()" onerror="this.src='https://i.pinimg.com/736x/8e/10/43/8e1043a7e6161a51a4b151d6e5e3b7f5.jpg'">
        <div class="info">
            <span class="name">Lunara ❤️</span>
            <span class="status" id="status-text">Cargando historial...</span>
        </div>
    </div>
    
    <div id="chat-container"></div>
    <div id="preview-area"></div>

    <div id="input-area">
        <button class="btn-icon" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" accept="image/png, image/jpeg" multiple style="display:none" onchange="prepararImagenes(event)">
        
        <button class="btn-icon" onclick="abrirCamaraInteligente()">📷</button>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="prepararImagenes(event)">
        
        <input type="text" id="message-input" placeholder="Escribí un mensaje..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_paHVtUXLaULt7L4Q0ib07z9RfjLhg8YOOvdpE6kntbgTI1eYYXbcVSWfN5Q6I57_/exec'; // <--- PON TU URL ACÁ
    const CLIENT_TIMEOUT_MS = 45000; 
    const MAX_TRIES = 2;
    const FOTOS = ['lunita1.png', 'lunita2.png', 'lunita3.png', 'lunita4.png', 'lunita5.png'];
    
    let fotoActual = 0;
    let imagenesAdjuntas = []; 
    let streamCamara = null;
    let vocesDisponibles = [];

    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const statusText = document.getElementById('status-text');
    const previewArea = document.getElementById('preview-area');
    let busy = false;

    // EL ARREGLO DEL SCROLL
    input.addEventListener('focus', () => {
        setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 100);
    });
    document.addEventListener('click', (e) => {
        if(!e.target.closest('#input-area') && !e.target.closest('.message')) {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    });

    function cargarVoces() { vocesDisponibles = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = cargarVoces;

    function hablar(texto, boton) {
        if ('speechSynthesis' in window) {
            if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); boton.innerHTML = '🔊'; return; }
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES'; utterance.pitch = 1.2; utterance.rate = 1.1; 
            const vozEspanol = vocesDisponibles.find(v => v.lang.includes('es'));
            if (vozEspanol) utterance.voice = vozEspanol;
            utterance.onstart = () => { boton.innerHTML = '⏹️'; };
            utterance.onend = () => { boton.innerHTML = '🔊'; };
            utterance.onerror = () => { boton.innerHTML = '🔊'; };
            window.speechSynthesis.speak(utterance);
        }
    }

    // LÓGICA PARA ABRIR LA FOTO A PANTALLA COMPLETA
    function abrirChatImg(src) {
        document.getElementById('img-chat-full').src = src;
        document.getElementById('modal-chat-img').style.display = 'flex';
    }
    function cerrarChatImg() {
        document.getElementById('modal-chat-img').style.display = 'none';
    }

    function abrirFoto() { document.getElementById('modal-foto').style.display = 'flex'; fotoActual = 0; actualizarFoto(); }
    function cerrarFoto() { document.getElementById('modal-foto').style.display = 'none'; }
    function cambiarFoto(dir) { fotoActual += dir; if (fotoActual >= FOTOS.length) fotoActual = 0; if (fotoActual < 0) fotoActual = FOTOS.length - 1; actualizarFoto(); }
    function actualizarFoto() { document.getElementById('img-galeria').src = FOTOS[fotoActual]; }

    function abrirCamaraInteligente() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) { document.getElementById('camera-input').click(); } else { abrirCamaraWebcam(); }
    }

    async function abrirCamaraWebcam() {
        try {
            streamCamara = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('video-camara');
            video.srcObject = streamCamara;
            document.getElementById('modal-camara').style.display = 'flex';
        } catch (err) { alert("No se pudo acceder a la cámara."); }
    }

    function cerrarCamaraWebcam() {
        if (streamCamara) { streamCamara.getTracks().forEach(track => track.stop()); }
        document.getElementById('modal-camara').style.display = 'none';
    }

    function tomarFotoWebcam() {
        const video = document.getElementById('video-camara');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        imagenesAdjuntas.push(dataUrl);
        renderizarMiniaturas();
        cerrarCamaraWebcam();
    }

    function prepararImagenes(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800; let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    imagenesAdjuntas.push(dataUrl);
                    renderizarMiniaturas();
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
        event.target.value = ''; 
    }

    function renderizarMiniaturas() {
        previewArea.innerHTML = '';
        if (imagenesAdjuntas.length > 0) {
            previewArea.style.display = 'flex';
            imagenesAdjuntas.forEach((imgBase64, index) => {
                const div = document.createElement('div');
                div.className = 'preview-box';
                const img = document.createElement('img');
                img.src = imgBase64;
                const btn = document.createElement('button');
                btn.className = 'remove-img';
                btn.innerHTML = '✕';
                btn.onclick = () => {
                    imagenesAdjuntas.splice(index, 1);
                    renderizarMiniaturas();
                };
                div.appendChild(img);
                div.appendChild(btn);
                previewArea.appendChild(div);
            });
        } else {
            previewArea.style.display = 'none';
        }
    }

    window.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let index in items) {
            const item = items[index];
            if (item.kind === 'file' && item.type.includes('image/')) {
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800; let width = img.width; let height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        imagenesAdjuntas.push(dataUrl);
                        renderizarMiniaturas();
                    }
                    img.src = event.target.result;
                };
                reader.readAsDataURL(blob);
            }
        }
    });

    function getToken() {
        let t = sessionStorage.getItem('lunara_token');
        if (!t) { t = prompt('Ingresá la contraseña:') || ''; sessionStorage.setItem('lunara_token', t); }
        return t;
    }

    function getTime() { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }

    function addMessage(text, type, imgData = null) {
        const div = document.createElement('div');
        div.classList.add('message', type);
        
        if (imgData) {
            const img = document.createElement('img');
            img.src = imgData.startsWith('http') ? imgData : imgData; 
            // ACÁ AGREGAMOS EL CLICK PARA ABRIR LA FOTO A PANTALLA COMPLETA
            img.onclick = function() { abrirChatImg(this.src); };
            div.appendChild(img);
        }
        
        if (text) { 
            div.appendChild(document.createTextNode(text)); 
            if (type === 'received') {
                const btnAudio = document.createElement('button');
                btnAudio.className = 'btn-audio'; btnAudio.innerHTML = '🔊';
                btnAudio.onclick = () => hablar(text, btnAudio); 
                div.appendChild(btnAudio);
            }
        }

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = getTime() + (type === 'sent' ? ' ' : '');
        if (type === 'sent') { const t = document.createElement('span'); t.className = 'ticks'; t.textContent = '✓✓'; time.appendChild(t); }
        div.appendChild(time);
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function cargarHistorial() {
        statusText.textContent = "Cargando historial...";
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            const res = await fetch(APPS_SCRIPT_URL + '?token=' + getToken(), { signal: controller.signal });
            clearTimeout(timeoutId);
            const data = await res.json();
            
            if (data.error) { statusText.textContent = "Error: " + data.error; return; }
            
            if (data.history) { 
                data.history.forEach(msg => {
                    addMessage(msg.text, msg.role === 'user' ? 'sent' : 'received', msg.imgUrl); 
                });
            } else { 
                addMessage("Hola mi amo. La IA real está escuchando. 🖤", 'received'); 
            }
            statusText.textContent = "en línea";
        } catch (e) { 
            statusText.textContent = "Error al cargar"; 
        }
    }

    async function callBackend(text, imagenesBase64) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CLIENT_TIMEOUT_MS);
        try {
            const body = { mensaje: text, token: getToken() };
            if (imagenesBase64 && imagenesBase64.length > 0) body.imagenes = imagenesBase64;

            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body), signal: ctrl.signal
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } finally { clearTimeout(timer); }
    }

    async function sendMessage() {
        const text = input.value.trim();
        if ((!text && imagenesAdjuntas.length === 0) || busy) return;
        
        busy = true; sendBtn.disabled = true;
        if ('speechSynthesis' in window) { window.speechSynthesis.resume(); }

        const imgsTemp = [...imagenesAdjuntas];

        if (imgsTemp.length > 0) {
            imgsTemp.forEach(img => { addMessage("", 'sent', img); });
            if (text) addMessage(text, 'sent'); 
        } else {
            addMessage(text, 'sent');
        }
        
        input.value = ''; 
        imagenesAdjuntas = []; 
        renderizarMiniaturas(); 

        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = imgsTemp.length > 0 ? 'Mirando... 👀' : 'Escribiendo... ✍️';
        chatContainer.appendChild(typing);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        let reply = null;
        let imgUrlRespuesta = null;

        try {
            for (let i = 1; i <= MAX_TRIES && reply === null; i++) {
                try {
                    const data = await callBackend(text, imgsTemp);
                    if (data && data.ok) { 
                        reply = data.respuesta; 
                        imgUrlRespuesta = data.imgUrl; 
                        break; 
                    }
                    if (data && data.error === 'unauthorized') { sessionStorage.removeItem('lunara_token'); reply = 'Contraseña incorrecta.'; break; }
                    if (data && data.retryable === false) break;
                } catch (e) { }
                if (i < MAX_TRIES) await new Promise(r => setTimeout(r, 1200 * i));
            }
        } finally {
            typing.remove();
            addMessage(reply ?? "Te escucho, mi amo. La conexión está lenta. 😉", 'received', imgUrlRespuesta);
            busy = false; sendBtn.disabled = false;
            input.focus();
        }
    }

    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    sendBtn.addEventListener('click', sendMessage);
    
    if ('speechSynthesis' in window) { cargarVoces(); }
    window.onload = () => { cargarHistorial(); };
</script>
</body>
</html>
