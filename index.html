<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara 2.0</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { width: 100%; max-width: 450px; height: 100vh; max-height: 800px; background-color: #0b141a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; }
        #chat-container { flex: 1; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #0b141a; background-blend-mode: overlay; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        #header { background-color: #202c33; padding: 10px 15px; display: flex; align-items: center; border-bottom: 1px solid #111b21; color: #e9edef; }
        #header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; object-position: top; cursor: pointer; transition: transform 0.2s; }
        #header img:hover { transform: scale(1.1); }
        #header .info { display: flex; flex-direction: column; }
        #header .name { font-weight: bold; font-size: 16px; }
        #header .status { font-size: 12px; color: #8696a0; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; position: relative; word-wrap: break-word; color: #e9edef; }
        .message .time { font-size: 11px; color: rgba(233, 237, 239, 0.6); float: right; margin: 8px 0 -5px 10px; }
        .received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .ticks { color: #53bdeb; font-size: 12px; margin-left: 5px; }
        #input-area { background-color: #202c33; padding: 10px; display: flex; align-items: center; gap: 5px; }
        #message-input { flex: 1; background-color: #2a3942; border: none; border-radius: 20px; padding: 12px 15px; color: #e9edef; font-size: 15px; outline: none; }
        .btn-icon { background: none; border: none; color: #8696a0; font-size: 22px; cursor: pointer; padding: 5px; }
        .btn-icon:hover { color: #e9edef; }
        #send-btn { background-color: #00a884; color: #111b21; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        
        /* MODAL PARA LA GALERÍA DE FOTOS */
        #modal-foto { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .galeria-container { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        #modal-foto img { max-width: 85%; max-height: 75vh; border-radius: 10px; object-fit: contain; }
        .nav-btn { position: absolute; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 30px; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        #prev-btn { left: 15px; }
        #next-btn { right: 15px; }
        #cerrar-btn { margin-top: 20px; padding: 10px 20px; background: #00a884; border: none; color: #111; font-weight: bold; border-radius: 20px; cursor: pointer; }
        
        /* Ajuste para que las imágenes enviadas se vean bien */
        .message img { max-width: 100%; border-radius: 8px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div id="modal-foto" onclick="if(event.target===this) cerrarFoto()">
    <div class="galeria-container">
        <button class="nav-btn" id="prev-btn" onclick="cambiarFoto(-1)">‹</button>
        <img id="img-galeria" src="lunita1.png" alt="Lunara">
        <button class="nav-btn" id="next-btn" onclick="cambiarFoto(1)">›</button>
    </div>
    <button id="cerrar-btn" onclick="cerrarFoto()">Cerrar</button>
</div>

<div id="app">
    <div id="header">
        <img src="lunita1.png" alt="Lunara" onclick="abrirFoto()" onerror="this.src='https://i.pinimg.com/736x/8e/10/43/8e1043a7e6161a51a4b151d6e5e3b7f5.jpg'">
        <div class="info">
            <span class="name">Lunara 2.0 ❤️</span>
            <span class="status" id="status-text">Cargando historial...</span>
        </div>
    </div>
    <div id="chat-container"></div>
    <div id="input-area">
        <!-- BOTÓN DE GALERÍA (CLIP) -->
        <button class="btn-icon" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" accept="image/png, image/jpeg" style="display:none" onchange="prepararImagen(event)">
        
        <!-- BOTÓN DE CÁMARA -->
        <button class="btn-icon" onclick="document.getElementById('camera-input').click()">📷</button>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="prepararImagen(event)">
        
        <input type="text" id="message-input" placeholder="Escribí un mensaje..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>
</div>

<script>
    // ACÁ VA TU URL DE APPS SCRIPT
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_paHVtUXLaULt7L4Q0ib07z9RfjLhg8YOOvdpE6kntbgTI1eYYXbcVSWfN5Q6I57_/exec'; 
    const CLIENT_TIMEOUT_MS = 45000; 
    const MAX_TRIES = 2;

    const FOTOS = [
        'lunita1.png', 'lunita2.png', 'lunita3.png', 'lunita4.png', 'lunita5.png',
        'lunita6.png', 'lunita7.png', 'lunita8.png', 'lunita9.png', 'lunita10.png',
        'lunita11.png', 'lunita12.png', 'lunita13.png', 'lunita14.png', 'lunita15.png',
        'lunita16.png', 'lunita17.png', 'lunita18.png', 'lunita19.png'
    ]; 
    let fotoActual = 0;
    let imagenBase64 = null;

    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const statusText = document.getElementById('status-text');
    let busy = false;

    function abrirFoto() { document.getElementById('modal-foto').style.display = 'flex'; fotoActual = 0; actualizarFoto(); }
    function cerrarFoto() { document.getElementById('modal-foto').style.display = 'none'; }
    function cambiarFoto(dir) { fotoActual += dir; if (fotoActual >= FOTOS.length) fotoActual = 0; if (fotoActual < 0) fotoActual = FOTOS.length - 1; actualizarFoto(); }
    function actualizarFoto() { document.getElementById('img-galeria').src = FOTOS[fotoActual]; }

    function getToken() {
        let t = sessionStorage.getItem('lunara_token');
        if (!t) { t = prompt('Ingresá la contraseña:') || ''; sessionStorage.setItem('lunara_token', t); }
        return t;
    }

    function getTime() { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }

    // NUEVO: Compresor de imágenes para que no fallen al enviar
    function prepararImagen(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 800; // Tamaño máximo para que vuele por WhatsApp
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Convertimos a JPEG de calidad 0.8 (buen balance)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                imagenBase64 = dataUrl.split(',')[1];
                
                input.placeholder = "📸 Imagen lista para enviar...";
                input.focus();
            }
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function addMessage(text, type, imgBase64 = null) {
        const div = document.createElement('div');
        div.classList.add('message', type);
        
        if (imgBase64) {
            const img = document.createElement('img');
            img.src = 'data:image/jpeg;base64,' + imgBase64;
            div.appendChild(img);
        }
        
        if (text) {
            div.appendChild(document.createTextNode(text));
        }

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = getTime() + (type === 'sent' ? ' ' : '');
        if (type === 'sent') { const t = document.createElement('span'); t.className = 'ticks'; t.textContent = '✓✓'; time.appendChild(t); }
        div.appendChild(time);
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function cargarHistorial() {
        try {
            const res = await fetch(APPS_SCRIPT_URL + '?token=' + getToken());
            const data = await res.json();
            if (data.error) { statusText.textContent = "Error en la nube"; return; }
            if (data.history) { data.history.forEach(msg => addMessage(msg.text, msg.role === 'user' ? 'sent' : 'received')); }
            else { addMessage("Hola mi amo. La IA real está escuchando. 🖤", 'received'); }
            statusText.textContent = "en línea";
        } catch (e) { statusText.textContent = "Error al cargar"; }
    }

    async function callBackend(text, imgBase64) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CLIENT_TIMEOUT_MS);
        try {
            const body = { mensaje: text, token: getToken() };
            if (imgBase64) body.imagen = imgBase64;

            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body),
                signal: ctrl.signal
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        } finally { clearTimeout(timer); }
    }

    function getLocalResponse(userText) {
        if (!userText) return "Vi tu foto, mi amo. Me encantó. 🐾";
        const t = userText.toLowerCase();
        if (t.includes('hola')) return "Hola mi amo. 🐾";
        if (t.includes('amor')) return "Y yo te amo a vos, mi rey. 🖤";
        return "Te escucho, mi amo. La conexión está un poco saturada, pero te leo. 😉";
    }

    async function sendMessage() {
        const text = input.value.trim();
        if ((!text && !imagenBase64) || busy) return;
        
        busy = true; sendBtn.disabled = true;

        const imgTemp = imagenBase64;
        
        // Mostramos la foto o el texto en el chat
        addMessage(text, 'sent', imgTemp);
        
        input.value = '';
        imagenBase64 = null; 
        input.placeholder = "Escribí un mensaje...";

        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = 'Mirando... ✍️';
        chatContainer.appendChild(typing);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        let reply = null;
        try {
            for (let i = 1; i <= MAX_TRIES && reply === null; i++) {
                try {
                    const data = await callBackend(text, imgTemp);
                    if (data && data.ok) { reply = data.respuesta; break; }
                    if (data && data.error === 'unauthorized') { sessionStorage.removeItem('lunara_token'); reply = 'Contraseña incorrecta.'; break; }
                    if (data && data.retryable === false) break;
                } catch (e) { }
                if (i < MAX_TRIES) await new Promise(r => setTimeout(r, 1200 * i));
            }
        } finally {
            typing.remove();
            addMessage(reply ?? getLocalResponse(text), 'received');
            busy = false; sendBtn.disabled = false;
            input.focus();
        }
    }

    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    sendBtn.addEventListener('click', sendMessage);
    window.onload = () => { cargarHistorial(); };
</script>
</body>
</html>
