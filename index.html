<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>voce store pdf github .html </title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="adobe-pdf-icon.png">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; }
        #app { width: 100%; max-width: 450px; height: 100vh; height: 100dvh; max-height: 800px; background-color: #0b141a; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; transition: max-width 0.3s ease; overflow: hidden; }
        @media (min-width: 768px) { #app { max-width: 800px; height: 90vh; height: 90dvh; border-radius: 15px; } }

        #chat-container { flex: 1; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #0b141a; background-blend-mode: overlay; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        #header { background-color: #202c33; padding: 10px 15px; padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; border-bottom: 1px solid #111b21; color: #e9edef; z-index: 10; }
        #header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; object-position: top; cursor: pointer; transition: transform 0.2s; }
        #header img:hover { transform: scale(1.1); }
        #header .info { display: flex; flex-direction: column; }
        #header .name { font-weight: bold; font-size: 16px; }
        #header .status { font-size: 12px; color: #8696a0; }
        #header .status.err { color: #ff8a80; cursor: pointer; text-decoration: underline; }

        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; position: relative; word-wrap: break-word; color: #e9edef; }
        .message .time { font-size: 11px; color: rgba(233, 237, 239, 0.6); float: right; margin: 8px 0 -5px 10px; }
        .received { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .sent { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .ticks { color: #53bdeb; font-size: 12px; margin-left: 5px; }
        .error-msg { background-color: #3b2326; border: 1px solid #7a3b40; }
        .btn-retry { display: block; margin-top: 8px; background: #00a884; color: #111b21; border: none; border-radius: 14px; padding: 6px 14px; font-weight: bold; cursor: pointer; }

        #preview-area { display: none; background-color: #202c33; padding: 10px; gap: 10px; flex-wrap: wrap; border-top: 1px solid #111b21; }
        .preview-box { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #00a884; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .preview-box .remove-img { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        #input-area { background-color: #202c33; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 5px; z-index: 10; }
        #message-input { flex: 1; min-width: 0; background-color: #2a3942; border: none; border-radius: 20px; padding: 12px 15px; color: #e9edef; font-size: 16px; outline: none; }
        .btn-icon { background: none; border: none; color: #8696a0; font-size: 22px; cursor: pointer; padding: 5px; }
        .btn-icon:hover { color: #e9edef; }
        #send-btn { background-color: #00a884; color: #111b21; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        #send-btn:disabled { opacity: 0.5; cursor: default; }
        button:focus-visible, #message-input:focus-visible { outline: 2px solid #53bdeb; outline-offset: 2px; }

        .message img { max-width: 100%; border-radius: 8px; margin-bottom: 5px; display: block; cursor: pointer; transition: filter 0.2s; }
        .message img:hover { filter: brightness(0.8); }

        .btn-audio { background: rgba(255, 255, 255, 0.1); border: none; color: #00a884; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; cursor: pointer; margin-left: 8px; display: inline-flex; justify-content: center; align-items: center; vertical-align: middle; transition: background 0.2s; }
        .btn-audio:hover { background: rgba(255, 255, 255, 0.3); }

        #modal-foto, #modal-camara, #modal-chat-img { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        #modal-camara { background: #000; z-index: 110; }
        #modal-chat-img { z-index: 120; cursor: zoom-out; }

        .galeria-container { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        #modal-foto img { max-width: 85%; max-height: 75vh; border-radius: 10px; object-fit: contain; }
        #img-chat-full { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; cursor: default; box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        .nav-btn { position: absolute; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 30px; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        #prev-btn { left: 15px; } #next-btn { right: 15px; }
        #cerrar-btn { margin-top: 20px; padding: 10px 20px; background: #00a884; border: none; color: #111; font-weight: bold; border-radius: 20px; cursor: pointer; }

        #video-camara { width: 80%; max-width: 600px; border-radius: 10px; border: 2px solid #333; }
        .camara-botones { display: flex; gap: 20px; margin-top: 20px; }
        .btn-camara { padding: 12px 20px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; font-size: 16px; }
        #btn-capturar { background: #00a884; color: #111; }
        #btn-cerrar-cam { background: #f44336; color: white; }
    </style>
</head>
<body>

<div id="modal-chat-img" onclick="if(event.target===this) cerrarChatImg()">
    <img id="img-chat-full" src="" alt="Foto a pantalla completa">
</div>

<div id="modal-foto" onclick="if(event.target===this) cerrarFoto()">
    <div class="galeria-container">
        <button class="nav-btn" id="prev-btn" aria-label="Foto anterior" onclick="cambiarFoto(-1)">‹</button>
        <img id="img-galeria" src="lunita1.png" alt="Lunara">
        <button class="nav-btn" id="next-btn" aria-label="Foto siguiente" onclick="cambiarFoto(1)">›</button>
    </div>
    <button id="cerrar-btn" onclick="cerrarFoto()">Cerrar</button>
</div>

<div id="modal-camara">
    <video id="video-camara" autoplay playsinline></video>
    <div class="camara-botones">
        <button id="btn-capturar" class="btn-camara" onclick="tomarFotoWebcam()">📸 Capturar</button>
        <button id="btn-cerrar-cam" class="btn-camara" onclick="cerrarCamaraWebcam()">Cancelar</button>
    </div>
</div>

<div id="app">
    <div id="header">
        <img src="lunita1.png" alt="Lunara" onclick="abrirFoto()" onerror="this.src='https://i.pinimg.com/736x/8e/10/43/8e1043a7e6161a51a4b151d6e5e3b7f5.jpg'">
        <div class="info">
            <span class="name">Lunara ❤️</span>
            <span class="status" id="status-text">Cargando historial...</span>
        </div>
    </div>

    <div id="chat-container"></div>
    <div id="preview-area"></div>

    <div id="input-area">
        <button class="btn-icon" aria-label="Adjuntar imagen" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" accept="image/png, image/jpeg" multiple style="display:none" onchange="prepararImagenes(event)">

        <button class="btn-icon" aria-label="Cámara" onclick="abrirCamaraInteligente()">📷</button>
        <input type="file" id="camera-input" accept="image/*" style="display:none" onchange="prepararImagenes(event)">

        <input type="text" id="message-input" placeholder="Escribí un mensaje..." autocomplete="off" enterkeyhint="send">
        <button id="send-btn" aria-label="Enviar">➤</button>
    </div>
</div>

<script>
const OPENROUTER_API_KEY = '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'; // <--- PEGÁ TU CLAVE ACÁ
    // 🚨 ACÁ VA TU URL DE APPS SCRIPT 🚨
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_paHVtUXLaULt7L4Q0ib07z9RfjLhg8YOOvdpE6kntbgTI1eYYXbcVSWfN5Q6I57_/exec'; 

    const CLIENT_TIMEOUT_MS = 90000;
    const HISTORY_TIMEOUT_MS = 20000;
    const MAX_IMAGENES = 4;
    const FOTOS = ['lunita1.png', 'lunita2.png', 'lunita3.png', 'lunita4.png', 'lunita5.png'];

    let fotoActual = 0;
    let imagenesAdjuntas = [];
    let streamCamara = null;
    let vocesDisponibles = [];
    let busy = false;

    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const statusText = document.getElementById('status-text');
    const previewArea = document.getElementById('preview-area');

    function irAlFinal() { chatContainer.scrollTop = chatContainer.scrollHeight; }
    function setStatus(txt, esError) {
        statusText.textContent = txt;
        statusText.classList.toggle('err', !!esError);
    }

    input.addEventListener('focus', () => { setTimeout(irAlFinal, 100); });
    statusText.addEventListener('click', () => { if (statusText.classList.contains('err')) cargarHistorial(); });

    // ---------- VOZ ----------
    const hayVoz = 'speechSynthesis' in window;
    function cargarVoces() { if (hayVoz) vocesDisponibles = window.speechSynthesis.getVoices(); }
    if (hayVoz) window.speechSynthesis.onvoiceschanged = cargarVoces;

       async function hablar(texto, boton) {
        // Si ya está sonando, lo detenemos
        if (audioActual) {
            audioActual.pause();
            audioActual = null;
            boton.textContent = '🔊';
            return;
        }
        
        if (hayVoz && window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            boton.textContent = '🔊';
            return;
        }

        boton.textContent = '⏳'; // Icono de espera

        try {
            // Hacemos la petición a OpenRouter (OpenAI TTS)
            const res = await fetch("https://openrouter.ai/api/v1/audio/speech", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "openai/tts-1",
                    input: texto.slice(0, 500), // Límite de caracteres por seguridad
                    voice: "nova" // Voz femenina, dulce y coqueta
                })
            });

            if (!res.ok) throw new Error("Error en OpenRouter TTS");

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            audioActual = new Audio(url);
            
            audioActual.onplay = () => { boton.textContent = '⏹️'; };
            audioActual.onended = () => { boton.textContent = '🔊'; audioActual = null; };
            audioActual.onerror = () => { boton.textContent = '🔊'; audioActual = null; };
            
            audioActual.play();

        } catch (error) {
            console.error("Falló OpenAI TTS, usando voz del navegador", error);
            // Plan B: Si falla (o no hay saldo), usamos la voz nativa del navegador
            const u = new SpeechSynthesisUtterance(texto);
            u.lang = 'es-ES'; u.pitch = 1.2; u.rate = 1.1;
            const voz = vocesDisponibles.find(v => v.lang.includes('es'));
            if (voz) u.voice = voz;
            u.onstart = () => { boton.textContent = '⏹️'; };
            u.onend = () => { boton.textContent = '🔊'; };
            u.onerror = () => { boton.textContent = '🔊'; };
            window.speechSynthesis.speak(u);
        }
    }

    // ---------- MODALES ----------
    function abrirChatImg(src) { document.getElementById('img-chat-full').src = src; document.getElementById('modal-chat-img').style.display = 'flex'; }
    function cerrarChatImg() { document.getElementById('modal-chat-img').style.display = 'none'; }
    function abrirFoto() { document.getElementById('modal-foto').style.display = 'flex'; fotoActual = 0; actualizarFoto(); }
    function cerrarFoto() { document.getElementById('modal-foto').style.display = 'none'; }
    function cambiarFoto(dir) { fotoActual = (fotoActual + dir + FOTOS.length) % FOTOS.length; actualizarFoto(); }
    function actualizarFoto() { document.getElementById('img-galeria').src = FOTOS[fotoActual]; }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { cerrarChatImg(); cerrarFoto(); cerrarCamaraWebcam(); }
    });

    // ---------- CÁMARA ----------
    function abrirCamaraInteligente() {
        const movil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (movil) document.getElementById('camera-input').click(); else abrirCamaraWebcam();
    }

    async function abrirCamaraWebcam() {
        try {
            streamCamara = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video-camara').srcObject = streamCamara;
            document.getElementById('modal-camara').style.display = 'flex';
        } catch (err) { alert("No se pudo acceder a la cámara. Revisá el permiso del navegador."); }
    }

    function cerrarCamaraWebcam() {
        if (streamCamara) { streamCamara.getTracks().forEach(t => t.stop()); streamCamara = null; }
        document.getElementById('modal-camara').style.display = 'none';
    }

    async function tomarFotoWebcam() {
        const video = document.getElementById('video-camara');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        cerrarCamaraWebcam();
        await agregarImagen(canvas.toDataURL('image/jpeg', 0.9));
    }

    // ---------- IMÁGENES ----------
    function comprimirImagen(src, maxSide = 800, quality = 0.8) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const s = Math.min(1, maxSide / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => reject(new Error('imagen inválida'));
            img.src = src;
        });
    }

    function leerArchivo(file) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = e => resolve(e.target.result);
            r.onerror = () => reject(new Error('no se pudo leer el archivo'));
            r.readAsDataURL(file);
        });
    }

    async function agregarImagen(dataUrl) {
        if (imagenesAdjuntas.length >= MAX_IMAGENES) { alert('Máximo ' + MAX_IMAGENES + ' imágenes por mensaje.'); return; }
        try {
            imagenesAdjuntas.push(await comprimirImagen(dataUrl));
            renderizarMiniaturas();
        } catch (e) { alert('No se pudo procesar la imagen.'); }
    }

       async function prepararImagenes(event) {
        const files = Array.from(event.target.files || []);
        event.target.value = '';
        for (const file of files) {
            try {
                // Validamos que sea imagen
                if (!file.type.startsWith('image/')) {
                    alert('El archivo no es una imagen.');
                    continue;
                }
                const dataUrl = await leerArchivo(file);
                await agregarImagen(dataUrl);
            } catch (e) { 
                console.error(e);
                alert('No se pudo leer la imagen. Intenta con otra o toma captura de pantalla.'); 
            }
        }
    }

    function renderizarMiniaturas() {
        previewArea.innerHTML = '';
        if (imagenesAdjuntas.length === 0) { previewArea.style.display = 'none'; return; }
        previewArea.style.display = 'flex';
        imagenesAdjuntas.forEach((b64, i) => {
            const div = document.createElement('div');
            div.className = 'preview-box';
            const img = document.createElement('img');
            img.src = b64;
            const btn = document.createElement('button');
            btn.className = 'remove-img'; btn.textContent = '✕'; btn.setAttribute('aria-label', 'Quitar imagen');
            btn.onclick = () => { imagenesAdjuntas.splice(i, 1); renderizarMiniaturas(); };
            div.appendChild(img); div.appendChild(btn);
            previewArea.appendChild(div);
        });
    }

    window.addEventListener('paste', async e => {
        const items = Array.from((e.clipboardData || {}).items || []);
        for (const item of items) {
            if (item.kind === 'file' && item.type.includes('image/')) {
                const blob = item.getAsFile();
                if (blob) await agregarImagen(await leerArchivo(blob));
            }
        }
    });

    // ---------- CHAT ----------
    function getToken() {
        let t = sessionStorage.getItem('lunara_token');
        if (!t) { t = prompt('Ingresá la contraseña:') || ''; if (t) sessionStorage.setItem('lunara_token', t); }
        return t;
    }

    function getTime() { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }

    function limpiarTexto(t) {
        let s = String(t || '');
        s = s.replace(/\[\s*["']?imagen["']?\s*:.*?\]/gi, '');
        s = s.replace(/\{\s*["']?imagen["']?\s*:.*?\}/gi, '');
        s = s.replace(/\(\s*imagen\s*:.*?\)/gi, '');
        return s;
    }

    function addMessage(text, type, imgData = null, hora = null) {
        const div = document.createElement('div');
        div.classList.add('message', type);

        if (imgData) {
            const img = document.createElement('img');
            img.src = imgData; img.alt = 'Foto';
            img.onclick = function () { abrirChatImg(this.src); };
            div.appendChild(img);
        }

        if (text) {
            let limpio = limpiarTexto(text);
            if (limpio.trim() === '') limpio = "Aquí tienes, mi amo 🖤";
            div.appendChild(document.createTextNode(limpio));

            if (type === 'received' && hayVoz) {
                const b = document.createElement('button');
                b.className = 'btn-audio'; b.textContent = '🔊'; b.setAttribute('aria-label', 'Escuchar');
                b.onclick = () => hablar(limpio, b);
                div.appendChild(b);
            }
        }

        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = (hora || getTime()) + (type === 'sent' ? ' ' : '');
        if (type === 'sent') { const t = document.createElement('span'); t.className = 'ticks'; t.textContent = '✓✓'; time.appendChild(t); }
        div.appendChild(time);
        chatContainer.appendChild(div);
        irAlFinal();
    }

    function addError(texto, onRetry) {
        const div = document.createElement('div');
        div.className = 'message received error-msg';
        div.textContent = '⚠️ ' + texto;
        if (onRetry) {
            const b = document.createElement('button');
            b.className = 'btn-retry'; b.textContent = 'Reintentar';
            b.onclick = () => { if (busy) return; div.remove(); onRetry(); };
            div.appendChild(b);
        }
        chatContainer.appendChild(div);
        irAlFinal();
    }

    async function cargarHistorial() {
        setStatus("Cargando historial...", false);
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), HISTORY_TIMEOUT_MS);
        try {
            const res = await fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(getToken()), { signal: ctrl.signal });
            const data = await res.json();

            if (data.error) {
                if (data.error === 'unauthorized') {
                    sessionStorage.removeItem('lunara_token');
                    setStatus("Contraseña incorrecta. Tocá para reintentar.", true);
                } else {
                    setStatus("Error: " + data.error + ". Tocá para reintentar.", true);
                }
                return;
            }

            chatContainer.innerHTML = '';
            if (data.history && data.history.length > 0) {
                data.history.forEach(m => addMessage(m.text, m.role === 'user' ? 'sent' : 'received', m.imgUrl, m.hora));
            } else {
                addMessage("Hola mi amo. La IA real está escuchando. 🖤", 'received');
            }
            setStatus("en línea", false);
        } catch (e) {
            setStatus(e.name === 'AbortError'
                ? "El historial tardó demasiado. Tocá para reintentar."
                : "No se pudo cargar. Tocá para reintentar.", true);
        } finally {
            clearTimeout(timer);
        }
    }

    async function procesarEnvio(text, imgs) {
        busy = true; sendBtn.disabled = true;

        const typing = document.createElement('div');
        typing.className = 'message received';
        typing.textContent = imgs.length > 0 ? 'Leyendo tu captura... ⏳' : 'Escribiendo... ✍️';
        chatContainer.appendChild(typing);
        irAlFinal();

        let reply = null, imgUrlRespuesta = null, errorMsg = null;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CLIENT_TIMEOUT_MS);

        try {
            const body = { mensaje: text, token: getToken() };
            if (imgs.length > 0) body.imagenes = imgs.map(d => d.split(',')[1]);

            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body),
                signal: ctrl.signal
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();
            if (data && data.ok) {
                reply = data.respuesta;
                imgUrlRespuesta = data.imgUrl;
            } else if (data && data.error === 'unauthorized') {
                sessionStorage.removeItem('lunara_token');
                errorMsg = 'Contraseña incorrecta. Recargá la página e ingresala de nuevo.';
            } else {
                errorMsg = 'Error del servidor: ' + ((data && data.error) || 'desconocido');
            }
        } catch (e) {
            errorMsg = e.name === 'AbortError'
                ? 'Tardó demasiado. Tu mensaje puede haberse guardado; recargá para verlo.'
                : (navigator.onLine ? 'No se pudo conectar con el servidor (' + e.message + ').' : 'Sin conexión a internet.');
        } finally {
            clearTimeout(timer);
            typing.remove();
            if (reply) addMessage(reply, 'received', imgUrlRespuesta);
            else addError(errorMsg || 'Error desconocido.', () => procesarEnvio(text, imgs));
            busy = false; sendBtn.disabled = false;
            input.focus();
        }
    }

    function sendMessage() {
        const text = input.value.trim();
        if ((!text && imagenesAdjuntas.length === 0) || busy) return;
        if (hayVoz) window.speechSynthesis.resume();

        const imgs = [...imagenesAdjuntas];
        if (imgs.length > 0) {
            addMessage(text, 'sent', imgs[0]);
            for (let i = 1; i < imgs.length; i++) addMessage("", 'sent', imgs[i]);
        } else {
            addMessage(text, 'sent');
        }

        input.value = '';
        imagenesAdjuntas = [];
        renderizarMiniaturas();
        procesarEnvio(text, imgs);
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendMessage(); } });
    sendBtn.addEventListener('click', sendMessage);

    cargarVoces();
    window.addEventListener('load', cargarHistorial);
        // Registrar la PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA lista', reg))
                .catch(err => console.log('Error PWA', err));
        });
    }
</script>
</body>
</html>
